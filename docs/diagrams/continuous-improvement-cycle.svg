<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-labelledby="title desc">
  <title id="title">EPOS continuous improvement cycle</title>
  <desc id="desc">Discover, design, deliver, and improve form a continuous engineering cycle.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#7890aa"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b4d; }
    .step { font-size: 13px; font-weight: 700; }
    .detail { font-size: 9.5px; fill: #52637a; }
    .card { stroke-width: 1; rx: 9; }
    .arrow { fill: none; stroke: #7890aa; stroke-width: 1.4; marker-end: url(#arrow); }
  </style>
  <rect width="420" height="250" rx="12" fill="#f8fafc"/>

  <path class="arrow" d="M200 67H220"/>
  <path class="arrow" d="M311 108V129"/>
  <path class="arrow" d="M220 171H200"/>
  <path class="arrow" d="M109 129V108"/>

  <g transform="translate(18 25)">
    <rect class="card" width="182" height="83" fill="#eef6ff" stroke="#8ab4df"/>
    <text class="step" x="16" y="25">01  Discover</text>
    <text class="detail" x="16" y="48">Understand the business need</text>
    <text class="detail" x="16" y="65">and the user workflow</text>
  </g>
  <g transform="translate(220 25)">
    <rect class="card" width="182" height="83" fill="#f7f1ff" stroke="#ac91d2"/>
    <text class="step" x="16" y="25">02  Design</text>
    <text class="detail" x="16" y="48">Model domain rules</text>
    <text class="detail" x="16" y="65">and application boundaries</text>
  </g>
  <g transform="translate(220 129)">
    <rect class="card" width="182" height="83" fill="#eff8f2" stroke="#8cbea0"/>
    <text class="step" x="16" y="25">03  Deliver</text>
    <text class="detail" x="16" y="48">Build and test</text>
    <text class="detail" x="16" y="65">then deploy and operate</text>
  </g>
  <g transform="translate(18 129)">
    <rect class="card" width="182" height="83" fill="#fff7e9" stroke="#dfb56f"/>
    <text class="step" x="16" y="25">04  Improve</text>
    <text class="detail" x="16" y="48">Observe and learn</text>
    <text class="detail" x="16" y="65">then refactor and optimize</text>
  </g>
  <text x="210" y="232" text-anchor="middle" font-size="9" fill="#77879a">Repeat with the next business need</text>
</svg>
